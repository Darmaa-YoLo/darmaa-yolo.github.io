<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff; --surface: #f6f6f5; --fg: #111111; --muted: #6b6b6b;
      --line: #ececec; --accent: #111111;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0e0e0e; --surface: #171717; --fg: #ededed; --muted: #8f8f8f; --line: #232323; --accent: #ededed; }
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 16px/1.65 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    p { margin: 0; }

    nav {
      position: sticky; top: 0; z-index: 10;
      background: color-mix(in srgb, var(--bg) 80%, transparent);
      backdrop-filter: saturate(180%) blur(12px);
      -webkit-backdrop-filter: saturate(180%) blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .nav-inner {
      max-width: 720px; margin: 0 auto; padding: 14px 24px;
      display: flex; justify-content: space-between; align-items: center; gap: 16px;
    }
    .brand { font-weight: 600; letter-spacing: -0.01em; }
    .nav-links { display: flex; gap: 22px; font-size: 0.9rem; color: var(--muted); }
    .nav-links a:hover { color: var(--fg); }

    main { max-width: 720px; margin: 0 auto; padding: 0 24px; }

    .hero { padding: 96px 0 72px; display: flex; flex-direction: column; gap: 28px; }
    .photo {
      width: 112px; height: 112px; border-radius: 50%; object-fit: cover;
      background: var(--surface); border: 1px solid var(--line);
    }
    h1 { font-size: clamp(2.2rem, 6vw, 3.2rem); line-height: 1.05; margin: 0; letter-spacing: -0.035em; font-weight: 600; }
    .role { color: var(--muted); font-size: 1.15rem; margin-top: 10px; }
    .bio { font-size: 1.1rem; max-width: 34em; }
    .links { display: flex; flex-wrap: wrap; gap: 10px; }
    .button {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 999px; font-size: 0.9rem; font-weight: 500;
      border: 1px solid var(--line); transition: background .2s, border-color .2s;
    }
    .button:hover { background: var(--surface); border-color: var(--muted); }
    .button.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    .button.primary:hover { opacity: .85; background: var(--fg); }

    section { padding: 56px 0; border-top: 1px solid var(--line); scroll-margin-top: 56px; }
    h2 {
      font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.14em;
      color: var(--muted); margin: 0 0 28px; font-weight: 500;
    }
    h3 { font-size: 1.05rem; margin: 0; font-weight: 600; letter-spacing: -0.01em; }

    .projects { display: grid; gap: 16px; }
    .card {
      display: block; padding: 24px; border-radius: 16px;
      background: var(--surface); border: 1px solid transparent;
      transition: border-color .2s, transform .2s;
    }
    .card:hover { border-color: var(--line); transform: translateY(-2px); }
    .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
    .card p { color: var(--muted); margin-top: 6px; }
    .card-links { display: flex; gap: 14px; font-size: 0.85rem; color: var(--muted); flex-shrink: 0; }
    .card-links a:hover { color: var(--fg); }

    .tags { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; margin: 14px 0 0; }
    .tags li {
      font-size: 0.78rem; padding: 3px 10px; border-radius: 999px;
      border: 1px solid var(--line); color: var(--muted); background: var(--bg);
    }
    .skills .tags { margin: 0; gap: 8px; }
    .skills .tags li { font-size: 0.9rem; padding: 6px 14px; color: var(--fg); }

    .job { display: grid; grid-template-columns: 140px 1fr; gap: 8px 24px; padding: 4px 0 24px; }
    .job + .job { padding-top: 24px; border-top: 1px solid var(--line); }
    .job .period { color: var(--muted); font-size: 0.9rem; padding-top: 1px; }
    .job .org { color: var(--muted); font-weight: 400; }
    .job p { margin-top: 6px; color: var(--muted); }

    footer {
      padding: 40px 0 56px; border-top: 1px solid var(--line);
      color: var(--muted); font-size: 0.85rem;
      display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    }

    .reveal { opacity: 0; transform: translateY(12px); transition: opacity .6s ease, transform .6s ease; }
    .reveal.visible { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; transition: none; }
      html { scroll-behavior: auto; }
    }

    @media (max-width: 560px) {
      .hero { padding: 64px 0 48px; }
      .nav-links { gap: 16px; }
      .job { grid-template-columns: 1fr; gap: 2px; }
      .card { padding: 20px; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a class="brand" href="#top" id="brand"></a>
      <div class="nav-links" id="nav-links"></div>
    </div>
  </nav>
  <main id="app"><p class="role" style="padding:96px 0">Loading…</p></main>

  <script>
    // Builds an element; text is set via textContent so content.json can't inject HTML.
    function element(tag, props = {}, children = []) {
      const node = Object.assign(document.createElement(tag), props);
      node.append(...children.filter(Boolean));
      return node;
    }

    function link(label, url, className) {
      if (!url) return null;
      const external = !url.startsWith("mailto:") && !url.startsWith("#");
      return element("a", { href: url, textContent: label, className: className || "",
        ...(external && { target: "_blank", rel: "noopener" }) });
    }

    function tagList(tags = []) {
      return tags.length ? element("ul", { className: "tags" }, tags.map(tag => element("li", { textContent: tag }))) : null;
    }

    function section(id, title, navLabel, children, className = "") {
      if (!children.length) return null;
      const node = element("section", { id, className: `reveal ${className}` }, [element("h2", { textContent: title }), ...children]);
      node.dataset.nav = navLabel;
      return node;
    }

    function initials(name) {
      return name.split(/\s+/).map(part => part[0]).join("").slice(0, 2).toUpperCase();
    }

    function photo(content) {
      const img = element("img", { className: "photo", src: content.photo || "", alt: `Photo of ${content.name}` });
      // Fall back to a placeholder avatar if no photo is set or it fails to load.
      img.onerror = () => {
        img.onerror = null;
        img.src = "images/profile-placeholder.svg";
      };
      if (!content.photo) img.src = "images/profile-placeholder.svg";
      return img;
    }

    function render(content) {
      document.title = `${content.name} — ${content.role}`;
      document.getElementById("brand").textContent = initials(content.name);

      const links = (content.links || []).map(item => link(item.label, item.url, "button"));
      if (content.email) links.unshift(link("Get in touch", "mailto:" + content.email, "button primary"));

      const projects = (content.projects || []).map(project => element("article", { className: "card" }, [
        element("div", { className: "card-head" }, [
          element("h3", { textContent: project.title }),
          element("div", { className: "card-links" }, [link("Live ↗", project.url), link("Code ↗", project.repo)])
        ]),
        element("p", { textContent: project.description }),
        tagList(project.tags)
      ]));

      const experience = (content.experience || []).map(job => element("article", { className: "job" }, [
        element("span", { className: "period", textContent: job.period }),
        element("div", {}, [
          element("h3", {}, [job.role, element("span", { className: "org", textContent: ` · ${job.org}` })]),
          element("p", { textContent: job.summary })
        ])
      ]));

      const sections = [
        section("work", "Selected work", "Work", projects.length ? [element("div", { className: "projects" }, projects)] : []),
        section("experience", "Experience", "Experience", experience),
        section("skills", "Skills", "Skills", content.skills?.length ? [tagList(content.skills)] : [], "skills")
      ].filter(Boolean);

      document.getElementById("nav-links").replaceChildren(
        ...sections.map(s => link(s.dataset.nav, "#" + s.id)),
        content.email ? link("Contact", "mailto:" + content.email) : null
      );

      document.getElementById("app").replaceChildren(
        element("header", { className: "hero reveal", id: "top" }, [
          photo(content),
          element("div", {}, [
            element("h1", { textContent: content.name }),
            element("p", { className: "role", textContent: [content.role, content.location].filter(Boolean).join(" · ") })
          ]),
          element("p", { className: "bio", textContent: content.bio }),
          element("div", { className: "links" }, links)
        ]),
        ...sections,
        element("footer", {}, [
          element("span", { textContent: `© ${new Date().getFullYear()} ${content.name}` }),
          link("Back to top ↑", "#top")
        ])
      );

      const observer = new IntersectionObserver(entries => entries.forEach(entry => {
        if (entry.isIntersecting) { entry.target.classList.add("visible"); observer.unobserve(entry.target); }
      }), { threshold: 0.1 });
      document.querySelectorAll(".reveal").forEach(node => observer.observe(node));
    }

    fetch("content.json")
      .then(response => response.json())
      .then(render)
      .catch(error => {
        document.getElementById("app").textContent = "Could not load content.json: " + error.message;
      });
  </script>
</body>
</html>
